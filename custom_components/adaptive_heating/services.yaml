warm_room_by:
  target:
    entity:
      domain: climate
      integration: adaptive_heating
  fields:
    temperature:
      required: true
      selector:
        number:
          min: 2
          max: 30
          step: 0.5
          unit_of_measurement: "°C"
    by_time:
      required: true
      selector:
        datetime:

hold_temperature:
  target:
    entity:
      domain: climate
      integration: adaptive_heating
  fields:
    temperature:
      required: true
      selector:
        number:
          min: 2
          max: 30
          step: 0.5
          unit_of_measurement: "°C"
    duration:
      required: true
      selector:
        duration:

set_warming_rate:
  target:
    entity:
      domain: climate
      integration: adaptive_heating
  fields:
    degrees_per_hour:
      required: true
      selector:
        number:
          min: 0.05
          max: 20
          step: 0.05
          unit_of_measurement: "°C/h"
    measured_at_outdoor:
      required: false
      selector:
        number:
          min: -50
          max: 50
          step: 0.5
          unit_of_measurement: "°C"

set_regulation:
  target:
    entity:
      domain: climate
      integration: adaptive_heating
  fields:
    behaviour:
      required: false
      selector:
        select:
          translation_key: holding_behaviour
          options:
            - paced
            - band
    band:
      required: false
      selector:
        number:
          min: 0.1
          max: 1
          step: 0.1
          unit_of_measurement: "°C"
    outdoor_shift_per_degree:
      required: false
      selector:
        number:
          min: 0
          max: 0.1
          step: 0.001
    cycle_length:
      required: false
      selector:
        duration:
    full_output_below:
      required: false
      selector:
        number:
          min: 0.1
          max: 10
          step: 0.1
          unit_of_measurement: "°C"
    shortest_time_between_relay_changes:
      required: false
      selector:
        duration:
    switched:
      required: false
      selector:
        select:
          translation_key: switched
          options:
            - "on"
            - "off"

return_to_target:
  target:
    entity:
      domain: climate
      integration: adaptive_heating
