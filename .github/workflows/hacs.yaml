name: HACS validation

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hacs:
    # Runs in the public integration repository only: the checks read its description and topics.
    if: github.repository == '0z00z0/ha-adaptive-heating'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
