# The add-on manifest. Read against Home Assistant's own add-on documentation at
# developers.home-assistant.io/docs/add-ons, as it stands for Supervisor 2026.04.0: add-ons are called apps
# there, arch is aarch64 and amd64 only, and build.yaml is no longer read.
name: Adaptive heating
version: 0.1.0-preview.1
slug: adaptive_heating
description: Planning, learning and the settings page for room-by-room cabin heating.
url: https://github.com/0z00z0/ha-adaptive-heating

# The two the published runtime base is built for. A 32-bit board is not covered.
arch:
  - aarch64
  - amd64

# The page is reached through Home Assistant and nowhere else.
ingress: true
ingress_port: 8099
panel_title: Heating
panel_icon: mdi:radiator
# The page sets how a cabin heats, so a household or guest account has no business on it.
panel_admin: true

# No ports key: nothing maps out of the container, so no address of the add-on's own answers on the box.

# Everything the add-on asks of Home Assistant goes over the Supervisor's websocket proxy, on the token handed
# to the add-on in its environment, and nothing goes over an ordinary web request. The permission is still
# required: the proxy refuses the websocket address without it. No user and no long-lived token exist anywhere.
homeassistant_api: true

startup: application
boot: auto

# The Supervisor connects to the page's own port and restarts the add-on when nothing answers. A crashed or hung
# process is otherwise dead until somebody notices, and nobody is at a cabin to notice. A bare connect and not an
# HTTP request: the page sits behind the ingress sign-in, and a listening socket is what a crash takes away.
# Read against developers.home-assistant.io/docs/apps/configuration as it stood on 2026-09-17, which documents
# the three URL forms and the [HOST] and [PORT:nnnn] substitutions.
# Not yet proven on a box: this add-on maps no port, and the documentation does not say what [PORT:8099] resolves
# to for a port that is in no ports map.
watchdog: tcp://[HOST]:[PORT:8099]

# What the Supervisor renders as this add-on's configuration form, and writes to /data/options.json for the
# process to read. Every one of these was a literal in a file before, so naming an entity needed a deploy.
options:
  outdoor_sensors: []

# A type ending in ? is optional and carries no default, so its key is deliberately absent from options above.
schema:
  # The dropdown both halves read the cabin's presence from. Unnamed reads as an empty cabin, and every room
  # then holds its away temperature.
  presence_helper: "str?"
  # Temperature sensors outside. They go through the same check a room's own sensors do, and where every one of
  # them fails the forecast below is what the rooms run on.
  outdoor_sensors:
    - str
  forecast_entity: "str?"
