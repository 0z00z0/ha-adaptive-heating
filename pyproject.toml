[project]
name = "adaptive-heating"
version = "0.1.0"
description = "The Home Assistant half of Adaptive Heating: a thermostat per room."
requires-python = ">=3.13"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["core", "_core", "custom_components"]
